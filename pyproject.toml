[project]
name = "python-debugger-mcp"
version = "0.6.0"
description = "MCP server for Python debugger (pdb) - Debug Python code through Claude/LLMs"
readme = "README.md"
authors = [
    { name = "samefarrar", email = "67292186+samefarrar@users.noreply.github.com" },
    { name = "simonwsy" }
]
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
python-debugger-mcp = "python_debugger_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
